<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hella highballs · dandan</title>
<meta name="description" content="Tue, Nov 12 · 7:30 PM · getting some cool people together for highballs :)">
<link rel="canonical" href="https://danielluzhu.github.io/dandan/e/3mFZQ8kU3YVlf32CKIhi.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8E%89</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Same tokens as public/styles.css, so the project page looks like the project. */
  :root {
    --bg: #fbf7f0; --bg-alt: #f4ece0; --surface: #fff;
    --ink: #241d18; --ink-soft: #6b5f55; --line: #e6dbcb;
    --accent: #6c5ad8; --accent-ink: #fff;
    --shadow: 0 1px 2px rgba(36,29,24,.06), 0 12px 28px -14px rgba(36,29,24,.28);
    --radius: 18px;
    --c-mahjong:#1f8a5c; --c-hikes:#c2703d; --c-film:#6c5ad8; --c-cabin:#2f6f8f;
    --c-parties:#d94f86; --c-homeless:#5f6b1a; --c-dining:#b3392c; --c-tasting:#7b2d55;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#14110f; --bg-alt:#1c1815; --surface:#221d1a;
      --ink:#f4ece2; --ink-soft:#a9998b; --line:#362e29;
      --accent:#9b8cf0; --accent-ink:#17120c;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 32px -16px rgba(0,0,0,.7);
      --c-mahjong:#4fc08a; --c-hikes:#e0955f; --c-film:#9b8cf0; --c-cabin:#62a6c6;
      --c-parties:#f279ab; --c-homeless:#b9c95f; --c-dining:#ef8175; --c-tasting:#d59bc4;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: Fraunces, ui-serif, Georgia, serif; font-weight: 700; line-height: 1.1; margin: 0; }
  a { color: inherit; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em;
         background: var(--bg-alt); padding: .12rem .38rem; border-radius: 5px; }
  .wrap { width: min(58rem, 100% - 2.5rem); margin-inline: auto; }

  .hero { padding: 5rem 0 3.5rem; text-align: center; border-bottom: 1px solid var(--line); }
  .hero__eyebrow { margin: 0 0 .6rem; text-transform: uppercase; letter-spacing: .16em;
                   font-size: .74rem; font-weight: 600; color: var(--ink-soft); }
  .hero h1 { font-size: clamp(3rem, 9vw, 5rem); }
  .hero__tagline { margin: 1rem auto 0; max-width: 34rem; color: var(--ink-soft); font-size: 1.06rem; }
  .hero__cta { display: flex; flex-wrap: wrap; gap: .7rem; justify-content: center; margin-top: 2rem; }
  .btn {
    display: inline-block; padding: .7rem 1.3rem; border-radius: 999px; text-decoration: none;
    font-weight: 600; font-size: .92rem; background: var(--accent); color: var(--accent-ink);
    border: 1px solid transparent; box-shadow: var(--shadow);
  }
  .btn--ghost { background: var(--surface); color: var(--ink); border-color: var(--line); box-shadow: none; }

  section { padding: 3.25rem 0; border-bottom: 1px solid var(--line); }
  section h2 { font-size: 1.6rem; }
  section > .wrap > p { color: var(--ink-soft); max-width: 42rem; }

  .cats { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1.5rem; padding: 0; list-style: none; }
  .cats li {
    display: flex; align-items: center; gap: .45rem; padding: .5rem .9rem;
    border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .9rem;
  }
  .cats .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--c); }

  .grid { display: grid; gap: 1rem; margin-top: 1.75rem;
          grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
  .card { padding: 1.35rem; border-radius: var(--radius); background: var(--surface);
          border: 1px solid var(--line); box-shadow: var(--shadow); }
  .card h3 { font-size: 1.05rem; margin-bottom: .5rem; }
  .card p { margin: 0; color: var(--ink-soft); font-size: .93rem; }

  .stack { margin-top: 1.5rem; padding: 0; list-style: none; display: grid; gap: .8rem; }
  .stack li { display: grid; grid-template-columns: 11rem 1fr; gap: 1rem; align-items: baseline;
              padding-bottom: .8rem; border-bottom: 1px solid var(--line); font-size: .94rem; }
  .stack li:last-child { border-bottom: 0; }
  .stack code { background: none; padding: 0; color: var(--accent); font-weight: 600; }
  .stack span { color: var(--ink-soft); }
  @media (max-width: 34rem) { .stack li { grid-template-columns: 1fr; gap: .2rem; } }

  pre { margin: 1.5rem 0 0; padding: 1.1rem 1.25rem; overflow-x: auto;
        border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .87rem; line-height: 1.7; }
  pre .c { color: var(--ink-soft); }

  /* ---------- events ---------- */
  .evs { display: grid; gap: 1.15rem; margin-top: 1.75rem;
         grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); }
  .ev {
    display: flex; flex-direction: column; overflow: hidden;
    border-radius: var(--radius); background: var(--surface);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    border-top: 3px solid var(--c);
  }
  .ev__media { position: relative; aspect-ratio: 3 / 2; margin: 0; background: var(--bg-alt);
               display: grid; place-items: center; }
  .ev__media figcaption {
    position: absolute; inset: auto 0 0 0; padding: .3rem .6rem;
    font-size: .66rem; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.6));
  }
  .ev__media img { width: 100%; height: 100%; object-fit: cover; }
  .ev__fallback { font-size: 2.5rem; }
  .ev__body { padding: 1.1rem 1.2rem 1.25rem; display: flex; flex-direction: column; gap: .4rem; flex: 1; }
  .ev__meta { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 0; }
  .ev__cat { font-size: .78rem; font-weight: 600; color: var(--c); }
  .ev__soon {
    font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
    padding: .18rem .5rem; border-radius: 999px; background: var(--bg-alt); color: var(--ink-soft);
  }
  .ev__title { font-size: 1.14rem; margin: .1rem 0 0; }
  .ev__when { margin: 0; font-size: .9rem; font-weight: 500; }
  .ev__where, .ev__desc { margin: 0; font-size: .86rem; color: var(--ink-soft); }
  .ev__foot { margin: auto 0 0; padding-top: .85rem; display: flex; align-items: center; gap: .75rem; }
  .ev__going { font-size: .82rem; color: var(--ink-soft); margin-left: auto; }
  .ev__cal { font-size: .82rem; color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line); }
  .ev__cal:hover { color: var(--ink); border-color: currentColor; }
  .sub { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; margin: 1.5rem 0 0; }
  .sub__hint { font-size: .82rem; color: var(--ink-soft); }
  .btn--sm { padding: .45rem .95rem; font-size: .84rem; box-shadow: none; }
  .ev--idea .ev__body { padding-bottom: 1.25rem; }

  .count { font: 500 .8rem/1 Inter, sans-serif; vertical-align: middle; color: var(--ink-soft);
           background: var(--bg-alt); padding: .3rem .55rem; border-radius: 999px; margin-left: .4rem; }

  .yr { margin-top: 2rem; }
  .yr__label { font-size: 1.05rem; color: var(--ink-soft); }
  .past { list-style: none; margin: .7rem 0 0; padding: 0; }
  .past li + li { border-top: 1px solid var(--line); }
  .past__row {
    display: grid; grid-template-columns: auto 1fr auto auto; gap: .9rem; align-items: center;
    padding: .7rem .3rem; text-decoration: none; color: inherit;
  }
  a.past__row:hover { background: var(--bg-alt); border-radius: 10px; }
  .past__dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--c); }
  /* A photo from the night takes the dot's place once there is one. */
  .past__pic { width: 2.6rem; height: 2.6rem; border-radius: 8px; object-fit: cover;
               margin: -.25rem 0; box-shadow: 0 0 0 1px var(--line); }
  .past__title { font-weight: 500; font-size: .94rem; }
  .past__cat, .past__date { font-size: .82rem; color: var(--ink-soft); white-space: nowrap; }
  @media (max-width: 34rem) {
    .past__row { grid-template-columns: auto 1fr auto; }
    .past__cat { display: none; }
  }

  /* ---------- filters ---------- */
  .filters {
    position: sticky; top: 0; z-index: 5; padding: .8rem 0;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .filters .wrap { display: flex; flex-wrap: wrap; gap: .45rem; }
  .chip {
    display: inline-flex; align-items: center; gap: .35rem; cursor: pointer;
    padding: .4rem .8rem; border-radius: 999px; font: 500 .84rem/1 Inter, sans-serif;
    color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  }
  .chip:hover { border-color: var(--c, var(--accent)); }
  .chip.is-on { background: var(--c, var(--accent)); border-color: transparent; color: #fff; }
  .chip--all.is-on { background: var(--ink); color: var(--bg); }
  .chip__n { font-size: .74rem; opacity: .7; }
  .is-hidden { display: none !important; }
  .empty { margin-top: 1.5rem; color: var(--ink-soft); font-size: .92rem; }

  /* ---------- one event's own page ---------- */
  .hero--one { padding: 3.5rem 0 2.5rem; text-align: left; }
  .hero--one h1 { font-size: clamp(2rem, 6vw, 3.2rem); }
  .hero--one .hero__eyebrow a { text-decoration: none; }
  .hero--one .hero__tagline { margin-inline: 0; }
  .hero--one .hero__cta { justify-content: flex-start; }
  .one { max-width: 44rem; }
  .one__media { position: relative; margin: 0 0 1.5rem; border-radius: var(--radius); overflow: hidden;
                border: 1px solid var(--line); }
  .one__media img { width: 100%; height: auto; }
  .one__media figcaption { position: absolute; inset: auto 0 0 0; padding: .3rem .6rem;
    font-size: .68rem; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .one__desc { white-space: pre-wrap; }
  .one__going { color: var(--ink-soft); font-size: .9rem; }

  .ask { background: var(--bg-alt); }
  .ask__cta { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-top: 1.5rem; }
  .ask__hint { font-size: .85rem; color: var(--ink-soft); }

  .stamp { width: min(58rem, 100% - 2.5rem); margin: 1.5rem auto 0;
           font-size: .8rem; color: var(--ink-soft); }

  .foot { padding: 2.75rem 0 3.5rem; text-align: center; color: var(--ink-soft); font-size: .86rem; }
  .foot a { font-weight: 600; }
</style>
