  if (!ownerMode && n) h.push('<div class="bar"><div class="in"><span><b>' + n + '</b> visit' + (n > 1 ? 's' : '') + ' picked</span><span class="actions"><button class="btn ghost" id="clearSel">Clear</button><button class="btn" id="signup">' + (writer ? 'Reserve' : 'Sign up') + '</button></span></div></div>');
  if (ownerMode) h.push('<div class="bar"><div class="in"><span id="dirtyMsg">' + dirtyMsg() + '</span><span class="actions"><button class="btn ghost" id="discard"' + (dirty ? '' : ' disabled') + '>Discard</button><button class="btn" id="publish"' + (dirty ? '' : ' disabled') + '>Publish changes</button></span></div></div>');
  app.innerHTML = h.join('');
  if (modal) app.appendChild(modal);
}

function renderOwnerPanel(d){
  var h = ['<div class="panel" id="ownerPanel"><h3>Owner tools <span class="ro">Only you see this. Changes go live when you publish.</span></h3>'];
  h.push('<div class="row"><div class="field"><label for="o_start">First day away</label><input type="date" id="o_start" value="' + esc(d.trip.start) + '"></div><div class="field"><label for="o_end">Last day away</label><input type="date" id="o_end" value="' + esc(d.trip.end) + '"></div></div>');
  h.push('<div class="row"><div class="field"><label for="o_spd">Visits per day</label><select id="o_spd"><option value="1"' + (d.slotsPerDay === 1 ? ' selected' : '') + '>1</option><option value="2"' + (d.slotsPerDay === 2 ? ' selected' : '') + '>2</option></select></div><div class="field"><label for="o_owners">Who is away</label><input id="o_owners" value="' + esc(d.owners) + '"></div></div>');
  h.push('<div class="row"><div class="field"><label for="o_s0">Visit 1 name</label><input id="o_s0" value="' + esc(d.slotNames[0]||'') + '"></div><div class="field"><label for="o_s1">Visit 2 name</label><input id="o_s1" value="' + esc(d.slotNames[1]||'') + '"></div></div>');
  h.push('<div class="row"><div class="field"><label for="o_k0">Kitten 1</label><input id="o_k0" value="' + esc(d.kittens[0]||'') + '"></div><div class="field"><label for="o_k1">Kitten 2</label><input id="o_k1" value="' + esc(d.kittens[1]||'') + '"></div></div>');
  h.push('<div class="row"><div class="field"><label for="o_k2">Kitten 3</label><input id="o_k2" value="' + esc(d.kittens[2]||'') + '"></div><div class="field"><label for="o_phone">Your phone (shown to sitters)</label><input id="o_phone" value="' + esc(d.contact.phone||'') + '" placeholder="optional"></div></div>');
  h.push('<div class="row"><div class="field"><label for="o_email">Your email (shown to sitters)</label><input id="o_email" value="' + esc(d.contact.email||'') + '" placeholder="optional"></div><div class="field"><label for="o_other">Other way to reach you</label><input id="o_other" value="' + esc(d.contact.other||'') + '" placeholder="e.g. WhatsApp, Instagram"></div></div>');
  h.push('<div class="field"><label for="o_notes">Notes for sitters (shown on the page)</label><textarea id="o_notes" placeholder="Parking, which closet the supplies are in, anything the kittens do…">' + esc(d.notes||'') + '</textarea></div>');
  h.push('<p class="ro">To add a sitter, tap an open visit in the schedule and type their name. Tap a covered visit to change or clear it.</p>');
  h.push('</div>');
  return h.join('');
}

function dirtyMsg(){ return dirty ? '<b>' + dirty + '</b> change' + (dirty > 1 ? 's' : '') + ' not published' : 'No unpublished changes'; }
function countDirty(){ return draft && JSON.stringify(draft) !== JSON.stringify(S) ? 1 + Object.keys(Object.assign({}, S.claims, draft.claims)).filter(function(k){ return JSON.stringify(S.claims[k]||null) !== JSON.stringify(draft.claims[k]||null); }).length : 0; }

function readOwnerForm(){
  if (!draft) return;
  var g = function(id){ var el = document.getElementById(id); return el ? el.value : ''; };
  draft.trip.start = g('o_start'); draft.trip.end = g('o_end');
  draft.slotsPerDay = +g('o_spd') || 1; draft.owners = g('o_owners').trim() || 'Dan and Ellie';
  draft.slotNames = [g('o_s0').trim() || 'Morning', g('o_s1').trim() || 'Evening'];
  draft.kittens = [g('o_k0').trim(), g('o_k1').trim(), g('o_k2').trim()];
  draft.contact = {phone: g('o_phone').trim(), email: g('o_email').trim(), other: g('o_other').trim()};
  draft.notes = g('o_notes');
  dirty = countDirty();
}

function openModal(html){ modal = document.createElement('div'); modal.className = 'modal'; modal.innerHTML = '<div class="card" role="dialog" aria-modal="true">' + html + '</div>'; app.appendChild(modal); var f = modal.querySelector('input,textarea'); if (f) f.focus(); }
function closeModal(){ if (modal) modal.remove(); modal = null; }
function toast(msg){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200); }

function pickedList(st){ return Object.keys(sel).sort().map(function(k){ var p = k.split('|'), d = parseDate(p[0]); return fmtShort(d) + ' · ' + slotLabel(st, +p[1]); }); }

function signupForm(){
  var list = pickedList(S);
  openModal('<h3>Sign up for ' + list.length + ' visit' + (list.length > 1 ? 's' : '') + '</h3><div class="picked">' + list.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' +
    '<div class="row"><div class="field"><label for="v_name">Your name</label><input id="v_name" value="' + esc(visitor.name) + '" autocomplete="name"></div><div class="field"><label for="v_phone">Phone or email</label><input id="v_phone" value="' + esc(visitor.phone) + '" autocomplete="tel"></div></div>' +
    '<div class="field"><label for="v_note">Anything to add (optional)</label><textarea id="v_note" placeholder="e.g. I can swap days if needed">' + esc(visitor.note) + '</textarea></div>' +
    '<div class="actions"><button class="btn ghost" id="m_cancel">Cancel</button><button class="btn" id="m_next">Next</button></div>');
}

function buildMessage(){
  var first = (S.owners || 'Dan').split(' and ')[0];
  var lines = ['Hi ' + first + '! I can cover kitten sitting on:'];
  pickedList(S).forEach(function(x){ lines.push('• ' + x); });
  lines.push('', 'Name: ' + visitor.name, 'Reach me: ' + visitor.phone);
  if (visitor.note.trim()) lines.push('Note: ' + visitor.note.trim());
  lines.push('', 'Send me the address and lockbox code when you can. 🐾');
  return lines.join('\n');
}

function messageView(){
  var msg = buildMessage(), c = S.contact || {}, first = (S.owners || 'Dan').split(' and ')[0];
  var how = [];
  if (c.phone) how.push('Text ' + esc(first) + ': <code>' + esc(c.phone) + '</code> <a href="sms:' + esc(c.phone.replace(/[^+\d]/g,'')) + '?&body=' + encodeURIComponent(msg) + '">open in Messages</a>');
  if (c.email) how.push('Email: <code>' + esc(c.email) + '</code> <a href="mailto:' + esc(c.email) + '?subject=' + encodeURIComponent('Kitten sitting') + '&body=' + encodeURIComponent(msg) + '">open in Mail</a>');
  if (c.other) how.push(esc(c.other));
  if (!how.length) how.push('Send it to ' + esc(first) + ' however you usually reach him (text, WhatsApp, etc.).');
  openModal('<h3>Send this to ' + esc(first) + '</h3><pre class="msg" id="msgText">' + esc(msg) + '</pre>' +
    '<div class="actions"><button class="btn" id="m_copy">Copy message</button></div>' +
    '<div class="contact">' + how.map(function(x){ return '<div>' + x + '</div>'; }).join('') + '</div>' +
    '<p class="ro">Your picks stay marked on this page until ' + esc(first) + ' adds your name. If a visit shows someone else by then, it was taken first.</p>' +
    '<div class="actions"><button class="btn ghost" id="m_back">Back</button><button class="btn" id="m_done">Done</button></div>');
}

function reserveForm(){
  var list = pickedList(S);
  openModal('<h3>Reserve ' + list.length + ' visit' + (list.length > 1 ? 's' : '') + '</h3><div class="picked">' + list.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' +
    '<div class="field"><label for="w_name">Your name (shown on the schedule)</label><input id="w_name" value="' + esc(visitor.name) + '" autocomplete="name"></div>' +
    '<p class="ro">' + esc((S.owners || 'Dan').split(' and ')[0]) + ' will reach out with the address and lockbox code.</p>' +
    '<div class="actions"><button class="btn ghost" id="m_cancel">Cancel</button><button class="btn" id="w_reserve">Reserve</button></div>');
}

function editForm(key){
  currentKey = key;
  var p = key.split('|'), d = parseDate(p[0]), cur = S.claims[key] || {};
  openModal('<h3>' + esc(fmtShort(d) + ' · ' + slotLabel(S, +p[1])) + '</h3>' +
    '<div class="field"><label for="w_name">Sitter name</label><input id="w_name" value="' + esc(cur.name||'') + '"></div>' +
    '<div class="actions"><button class="btn danger" id="w_free">Free this visit</button><button class="btn ghost" id="m_cancel">Cancel</button><button class="btn" id="w_update">Update</button></div>');
}

function assignForm(key){
  currentKey = key;
  var p = key.split('|'), d = parseDate(p[0]), cur = draft.claims[key] || {};
  openModal('<h3>' + esc(fmtShort(d) + ' · ' + slotLabel(draft, +p[1])) + '</h3>' +
    '<div class="field"><label for="a_name">Sitter name (shown on the schedule)</label><input id="a_name" value="' + esc(cur.name||'') + '"></div>' +
    '<div class="actions">' + (cur.name ? '<button class="btn danger" id="a_clear">Clear visit</button>' : '') + '<button class="btn ghost" id="m_cancel">Cancel</button><button class="btn" id="a_save">Save</button></div>');
}

// ---- shared reservation list, kept by the server ----
function applyServer(st){ S.claims = st.claims || {}; PHOTOS = st.photos || PHOTOS; }
function loadState(){
  return fetch('api/state').then(function(r){ return r.json(); }).then(function(st){ applyServer(st); if (!modal) render(); }).catch(function(){});
}
// Send the difference between the current list and `next` as one request per changed visit.
function publishState(next, btnId, label){
  var btn = btnId ? document.getElementById(btnId) : null; if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  var keys = Object.keys(Object.assign({}, S.claims, next.claims)), taken = 0, failed = 0;
  var ops = keys.map(function(k){
    var was = S.claims[k] && S.claims[k].name, now = next.claims[k] && next.claims[k].name;
    if (was === now) return null;
    var url = 'api/claims/' + encodeURIComponent(k);
    if (!now) return {url: url, method: 'DELETE'};
    return {url: url, method: was ? 'PUT' : 'POST', body: JSON.stringify({name: now})};
  }).filter(Boolean);
  ops.reduce(function(p, op){
    return p.then(function(){
      return fetch(op.url, {method: op.method, headers: {'Content-Type': 'application/json'}, body: op.body}).then(function(r){
        if (r.status === 409) taken++; else if (!r.ok) failed++;
      }, function(){ failed++; });
    });
  }, Promise.resolve()).then(function(){
    if (failed && btn) { btn.disabled = false; btn.textContent = label || 'Save'; }
    if (!failed) { sel = {}; closeModal(); }
    toast(failed ? 'Could not save. Try again in a moment.' : taken ? taken + ' visit' + (taken > 1 ? 's were' : ' was') + ' just taken by someone else' : 'Saved');
    return loadState();
  }).then(function(){ render(); });
}
function publishDraft(){
  if (!artifact || !draft) return;
  readOwnerForm();
  publishState(JSON.parse(JSON.stringify(draft)), 'publish', 'Publish changes');
}

// ---- events ----
app.addEventListener('click', function(ev){
  var t = ev.target.closest('button, a'); if (!t) return;
  var id = t.id;
  if (t.classList.contains('slot')) {
    var key = t.getAttribute('data-key');
    if (ownerMode && draft) { assignForm(key); return; }
    if (t.classList.contains('taken')) { if (writer) editForm(key); return; }
    if (sel[key]) delete sel[key]; else sel[key] = true;
    render(); return;
  }
  if (id === 'clearSel') { sel = {}; render(); }
  else if (id === 'signup') { if (writer) reserveForm(); else signupForm(); }
  else if (id === 'w_reserve') {
    var wn = document.getElementById('w_name').value.trim();
    if (!wn) { document.getElementById('w_name').focus(); toast('Add your name first'); return; }
    visitor.name = wn; try { localStorage.setItem('kitten-visitor', JSON.stringify(visitor)); } catch(e){}
    var nx = JSON.parse(JSON.stringify(S));
    Object.keys(sel).forEach(function(k){ if (!(nx.claims[k] && nx.claims[k].name)) nx.claims[k] = {name: wn}; });
    publishState(nx, 'w_reserve', 'Reserve');
  }
  else if (id === 'w_update') {
    var un = document.getElementById('w_name').value.trim(), nx2 = JSON.parse(JSON.stringify(S));
    if (un) nx2.claims[modalKey()] = {name: un}; else delete nx2.claims[modalKey()];
    publishState(nx2, 'w_update', 'Update');
  }
  else if (id === 'w_free') { var nx3 = JSON.parse(JSON.stringify(S)); delete nx3.claims[modalKey()]; publishState(nx3, 'w_free', 'Free this visit'); }
  else if (id === 'm_cancel') { closeModal(); }
  else if (id === 'm_next') {
    visitor = {name: document.getElementById('v_name').value.trim(), phone: document.getElementById('v_phone').value.trim(), note: document.getElementById('v_note').value};
    if (!visitor.name) { document.getElementById('v_name').focus(); toast('Add your name first'); return; }
    try { localStorage.setItem('kitten-visitor', JSON.stringify(visitor)); } catch(e){}
    closeModal(); messageView();
  }
  else if (id === 'm_back') { closeModal(); signupForm(); }
  else if (id === 'm_done') { closeModal(); toast('Thanks! Watch for your name on the schedule.'); }
  else if (id === 'm_copy') {
    var txt = document.getElementById('msgText').textContent;
    var done = function(){ toast('Copied'); };
    var fallback = function(){ var r = document.createRange(); r.selectNodeContents(document.getElementById('msgText')); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast('Select all and copy'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
  }
  else if (id === 'ownerToggle') {
    if (ownerMode) { if (dirty) { toast('Publish or discard your changes first'); return; } ownerMode = false; draft = null; }
    else { ownerMode = true; draft = JSON.parse(JSON.stringify(S)); dirty = 0; sel = {}; }
    render();
    if (ownerMode) { var p = document.getElementById('ownerPanel'); if (p) p.scrollIntoView({block:'start'}); }
  }
  else if (id === 'discard') { draft = JSON.parse(JSON.stringify(S)); dirty = 0; render(); }
  else if (id === 'publish') { publishDraft(); }
  else if (id === 'a_save') {
    var k = modalKey(), nm = document.getElementById('a_name').value.trim();
    if (nm) draft.claims[k] = {name: nm}; else delete draft.claims[k];
    closeModal(); dirty = countDirty(); render();
  }
  else if (id === 'a_clear') { delete draft.claims[modalKey()]; closeModal(); dirty = countDirty(); render(); }
});
var currentKey = null;
function modalKey(){ return currentKey; }

app.addEventListener('input', function(ev){ if (ownerMode && draft && ev.target.closest('#ownerPanel')) { readOwnerForm(); var m = document.getElementById('dirtyMsg'); if (m) m.innerHTML = dirtyMsg(); ['discard','publish'].forEach(function(i){ var b = document.getElementById(i); if (b) b.disabled = !dirty; }); } });
app.addEventListener('change', function(ev){ if (ownerMode && draft && ev.target.closest('#ownerPanel')) { readOwnerForm(); if (ev.target.id === 'o_start' || ev.target.id === 'o_end' || ev.target.id === 'o_spd' || ev.target.id === 'o_s0' || ev.target.id === 'o_s1' || ev.target.id === 'o_k0' || ev.target.id === 'o_k1' || ev.target.id === 'o_k2' || ev.target.id === 'o_owners') render(); } });
document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && modal) closeModal(); });

render();

// Anyone with the link can reserve, change or free visits; refresh so others' changes show up.
loadState();
setInterval(function(){ if (!document.hidden && !modal) loadState(); }, 30000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden && !modal) loadState(); });
})();
</script>

</body></html>
