S.kittens = S.kittens || []; S.bios = S.bios || {};
var app = document.getElementById('app');
var RES = [];              // shared reservations from the server: {id, date, name, time}
var TIMES = ['Morning','Midday','Afternoon','Evening','Flexible'];
var PHOTOS = [];           // files in photos/, from the server
var sel = {};              // days this visitor has picked: 'YYYY-MM-DD' -> true
var modal = null, editing = null;
var UPLOADS = [];          // photos visitors added: {id, file, name}
var CHORES = [];           // chore sign-offs, newest first: {id, task, date, name}
var uploading = false;
var galleryOpen = false;   // the page re-renders often, so remember whether the gallery is expanded
var careOpen = {};         // ...and which care cards have their how-to open, by title
var histOpen = {};         // ...and which chore histories are expanded, by task id
var visitor = {name:'', time:'Flexible'};
try { var v = JSON.parse(localStorage.getItem('kitten-visitor') || 'null'); if (v && v.name) visitor = {name: v.name, time: v.time || 'Flexible'}; } catch(e){}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function parseDate(s){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
// Everything on the site runs on San Francisco time, wherever the viewer is.
function todaySF(){ try { return new Intl.DateTimeFormat('en-CA', {timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date()); } catch(e){ return iso(new Date()); } }
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
// Short forms for the narrow phone calendar.
var TIME_SHORT = {Morning:'AM', Midday:'Noon', Afternoon:'PM', Evening:'Eve', Flexible:'Any'};
function timeLabel(t){ return t === 'Flexible' ? 'Any time' : t; }
function fmtShort(d){ return DOW[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' + d.getDate(); }
function fmtLong(d){ return MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
function days(st){ var a = parseDate(st.trip.start), b = parseDate(st.trip.end), out = []; if (!a || !b || b < a) return out; for (var d = new Date(a); d <= b && out.length < 120; d.setDate(d.getDate()+1)) out.push(new Date(d)); return out; }
function kittenNames(st){ return st.kittens.filter(function(k){ return k && k.trim(); }); }
function firstOwner(){ return (S.owners || 'Dan').split(' and ')[0]; }
function photoFor(name){ var base = name.toLowerCase().replace(/[^a-z0-9]/g, ''), exts = ['jpg','jpeg','png','webp']; for (var i = 0; i < exts.length; i++) if (PHOTOS.indexOf(base + '.' + exts[i]) >= 0) return base + '.' + exts[i]; return null; }
// A day's reservations, earliest time of day first.
function resOn(k){ return RES.filter(function(r){ return r.date === k; }).sort(function(a, b){ return TIMES.indexOf(a.time) - TIMES.indexOf(b.time) || a.id - b.id; }); }
function timeOptions(cur){ return TIMES.map(function(t){ return '<option value="' + t + '"' + (t === cur ? ' selected' : '') + '>' + timeLabel(t) + '</option>'; }).join(''); }

// Where a recurring task stands: last sign-off, and for timed tasks when it's next due.
function choreStatus(t){
  var log = CHORES.filter(function(c){ return c.task === t.id; }), last = log[0];
  var lastTxt = last ? 'Last done ' + dayWord(last.date) + ' by ' + last.name : 'Not done yet';
  if (!t.every) return {due: false, lines: [lastTxt]};
  if (!last) return {due: true, lines: ['Not done yet: due now']};
  var next = parseDate(last.date); next.setDate(next.getDate() + t.every);
  var today = parseDate(todaySF()), diff = Math.round((next - today) / 864e5);
  var nextTxt = diff < 0 ? 'Overdue since ' + fmtShort(next) : diff === 0 ? 'Due today' : diff === 1 ? (t.every === 1 ? 'Done for today' : 'Due tomorrow') : 'Next due ' + fmtShort(next);
  return {due: diff <= 0, lines: [lastTxt, nextTxt]};
}
function dayWord(k){ var d = Math.round((parseDate(todaySF()) - parseDate(k)) / 864e5); return d === 0 ? 'today' : d === 1 ? 'yesterday' : fmtShort(parseDate(k)); }
function choreTask(id){ var found = null; (S.care || []).forEach(function(c){ (c.tasks || []).forEach(function(t){ if (t.id === id) found = t; }); }); return found; }

function catSvg(){ return '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 13 5 4l7 5h8l7-5-1 9c2 2 3 5 3 8 0 6-6 9-13 9S3 27 3 21c0-3 1-6 3-8z" fill="var(--ink-soft)" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="18" r="1.5" fill="var(--ink)"/><circle cx="20" cy="18" r="1.5" fill="var(--ink)"/><path d="M14.5 22h3l-1.5 1.5z" fill="var(--ink)"/></svg>'; }

function render(){
  var st = S, ds = days(st), names = kittenNames(st), h = [];
  h.push('<div class="wrap">');
  h.push('<header class="hero"><h1>Let\'s play with the kitties</h1>');
  var a = parseDate(st.trip.start), b = parseDate(st.trip.end);
  h.push('<div class="dates">' + (a && b ? '🗓 ' + fmtLong(a) + ' – ' + fmtLong(b) + ' · ' + ds.length + ' days' : 'Travel dates coming soon') + '</div>');
  h.push('<div class="welcome"><p>Thank you for being here. We miss the kittens a lot and are happy to know that even while away, the kittens will have such caring and trustworthy people.</p><p>Please let me know if you have any questions and please send photos. There is a photo card printer and photo album of the cats that you are welcome to use.</p><p class="sig">Dan and Ellie</p></div>');
  h.push('</header>');

  if (names.length) {
    h.push('<section><h2>Meet the kittens</h2>');
    if (PHOTOS.indexOf('all.jpg') >= 0) h.push('<figure class="group"><img src="photos/all.jpg" alt="' + esc(names.join(', ')) + ' together on the bed"></figure>');
    h.push('<div class="kgrid">' + names.map(function(n){
      var parts = n.split(' '), latin = parts.shift(), photo = photoFor(latin), bio = st.bios[latin.toLowerCase()] || {};
      return '<div class="kcard"><div class="pic">' + (photo ? '<img src="photos/' + esc(photo) + '" alt="' + esc(latin) + '">' : '<div class="ph">' + catSvg() + '<span>Photo coming soon</span></div>') + '</div>' +
        '<div class="nm"><div class="who"><b>' + esc(latin) + '</b>' + (parts.length ? '<span>' + esc(parts.join(' ')) + '</span>' : '') + '</div>' +
        (bio.looks ? '<p class="looks">' + esc(bio.looks) + '</p>' : '') +
        (bio.likes && bio.likes.length ? '<p class="likes"><span class="k">Likes</span> ' + esc(bio.likes.join(', ')) + '</p>' : '') +
        (bio.tip ? '<p class="tip">' + esc(bio.tip) + '</p>' : '') + '</div></div>';
    }).join('') + '</div>');
    // Dan's photos first (credited to him), then ones visitors uploaded (credited, removable), then the add button.
    var gallery = PHOTOS.filter(function(f){ return /^gallery-/.test(f); }).sort(), count = gallery.length + UPLOADS.length;
    h.push('<details class="more" id="moreKittens"' + (galleryOpen ? ' open' : '') + '><summary>More of the kittens <span class="ro">' + count + ' photo' + (count === 1 ? '' : 's') + '</span></summary><div class="gallery">' +
      gallery.map(function(f){ return '<div class="tile"><a href="photos/' + esc(f) + '" target="_blank" rel="noopener"><img src="photos/' + esc(f) + '" alt="The kittens, from ' + esc(firstOwner()) + '" loading="lazy"></a><span class="by">' + esc(firstOwner()) + '</span></div>'; }).join('') +
      UPLOADS.map(function(u){
        return '<div class="tile"><a href="uploads/' + esc(u.file) + '" target="_blank" rel="noopener"><img src="uploads/' + esc(u.file) + '" alt="The kittens' + (u.name ? ', from ' + esc(u.name) : '') + '" loading="lazy"></a>' +
          (u.name ? '<span class="by">' + esc(u.name) + '</span>' : '') + '<button class="rm" data-photo="' + u.id + '" aria-label="Remove this photo" title="Remove">×</button></div>';
      }).join('') +
      '<button class="add-photo" id="addPhotos"' + (uploading ? ' disabled' : '') + '>' + (uploading ? 'Uploading…' : '<b>+</b>Add your photos') + '</button>' +
      '</div></details>');
    h.push('</section>');
  }

  h.push('<section><h2>What a visit involves</h2><p class="note">20–30 minutes.</p>');
  var lastWet = CHORES.filter(function(c){ return c.task === 'wetfood'; })[0];
  h.push('<ol class="steps"><li>Have the three kitties share one wet food can a day (most recent: ' + (lastWet ? esc(dayWord(lastWet.date) + ' by ' + lastWet.name) : 'none yet') + ').</li>' +
    '<li>Check the feeder, fountain and litter box; refill or empty as needed, and tap <b>Done</b> on what you did (<a href="#care">details</a>).</li>' +
    '<li>5–10 minutes of dedicated attention for each kitten: play, pets. Gently touch her belly and paws when you can. Other two can be in closet if needed.</li>' +
    '<li>Let everyone out of the closet. Scan the bedroom: nothing knocked over, and no potential liabilities (their jumping improves every day). Lock up; key back in the lockbox.</li></ol>');
  h.push('<div class="facts"><div class="fact">' + (PHOTOS.indexOf('door.jpg') >= 0 ? '<a class="fact-pic" href="photos/door.jpg" target="_blank" rel="noopener"><img src="photos/door.jpg" alt="The bedroom door: double doors at the top of the stairs" loading="lazy"></a>' : '') + '<span class="k">Getting in</span><span>Upstairs double door bedroom</span><span>Lockbox on cabinet by the stairs</span><span class="rec">📹 The bedroom has a camera that records while we\'re away.</span></div>');
  h.push('<div class="fact"><span class="k">Vacuum</span><span>At the foot of the stairs, for litter or food spills.</span></div>');
  if (st.notes) h.push('<div class="fact"><span class="k">Notes from the owners</span><span>' + esc(st.notes).replace(/\n/g,'<br>') + '</span></div>');
  h.push('</div></section>');

  // How to hold and play with the kittens.
  if (st.handling && st.handling.length) {
    h.push('<section id="handling"><h2>Holding &amp; playing</h2><div class="facts">' + st.handling.map(function(x){
      return '<div class="fact hand"><span class="k">' + x.icon + ' ' + esc(x.title) + '</span><ul>' + x.items.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' +
        (x.note ? '<p class="care-note">' + esc(x.note) + '</p>' : '') + '</div>';
    }).join('') + '</div></section>');
  }

  if (st.care && st.care.length) {
    h.push('<section id="care"><h2>Food, water &amp; litter</h2><div class="care">');
    st.care.forEach(function(c){
      var cp = c.photo || 'care-' + c.title.toLowerCase() + '.jpg';
      h.push('<div class="care-card">' + (PHOTOS.indexOf(cp) >= 0 ? '<a class="care-pic" href="photos/' + cp + '" target="_blank" rel="noopener"><img src="photos/' + cp + '" alt="' + esc(c.device) + '" loading="lazy"' + (c.photoPos ? ' style="object-position:' + esc(c.photoPos) + '"' : '') + '>' + (c.credit ? '<span class="credit">' + esc(c.credit) + '</span>' : '') + '</a>' : '') + '<div class="care-h"><span class="care-i" aria-hidden="true">' + c.icon + '</span><div><h3>' + esc(c.title) + '</h3><span class="ro">' + esc(c.device) + '</span></div></div>');
      if (c.rows && c.rows.length) {
        h.push('<dl>');
        c.rows.forEach(function(r){
          var v = Array.isArray(r[1]) ? '<table class="feed">' + r[1].map(function(x){ return '<tr><th>' + esc(x[0]) + '</th><td>' + esc(x[1]) + '</td></tr>'; }).join('') + '</table>' : esc(r[1]);
          h.push('<dt>' + esc(r[0]) + '</dt><dd' + (r[1] && r[1].length ? '' : ' class="tbd"') + '>' + (r[1] && r[1].length ? v : 'To be added') + '</dd>');
        });
        h.push('</dl>');
      }
      // Recurring tasks: sitters sign off when they do one, so the next sitter knows whether it's due.
      (c.tasks || []).forEach(function(t){
        var cs = choreStatus(t), log = CHORES.filter(function(x){ return x.task === t.id; });
        h.push('<div class="chore-box"><div class="chore' + (cs.due ? ' due' : '') + '"><div class="chore-t"><b>' + esc(t.label) + '</b><span class="when' + (t.when ? '' : ' tbd') + '">' + (t.when ? esc(t.when) : 'How often: to be added') + '</span>' + cs.lines.map(function(l){ return '<span class="chore-s">' + esc(l) + '</span>'; }).join('') + '</div>' +
          '<button class="btn small' + (cs.due ? '' : ' ghost') + '" data-chore="' + esc(t.id) + '" aria-label="' + esc(t.label) + ': sign off">Done</button></div>' +
          // Older sign-offs fold away; the latest is already in the status line.
          (log.length ? '<details class="hist" data-hist="' + esc(t.id) + '"' + (histOpen[t.id] ? ' open' : '') + '><summary>History (' + log.length + ')</summary><ul class="log">' +
            log.map(function(x){ return '<li><span>' + esc(fmtShort(parseDate(x.date))) + ' · ' + esc(x.name) + '</span><button class="unlog" data-log="' + x.id + '" aria-label="Remove this sign-off" title="Remove">×</button></li>'; }).join('') + '</ul></details>' : '') + '</div>');
      });
      // Maintenance steps and warnings fold away; the at-a-glance rows above stay visible.
      h.push('<details class="care-steps" data-care="' + esc(c.title) + '"' + (careOpen[c.title] ? ' open' : '') + '><summary><span class="k">How to</span></summary>' +
        (c.steps && c.steps.length ? '<ol>' + c.steps.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>' : '<p class="tbd">To be added</p>') +
        (c.note ? '<p class="care-note">' + esc(c.note) + '</p>' : '') + '</details></div>');
    });
    h.push('</div></section>');
  }

  h.push('<section id="schedule"><h2>Schedule</h2>');
  if (!ds.length) {
    h.push('<div class="empty">Dates not set yet.</div>');
  } else {
    h.push('<div class="legend"><span><i class="dot open"></i>No one yet</span><span><i class="dot taken"></i>Covered</span><span><i class="dot sel"></i>Your picks</span></div>');
    // Calendar: whole weeks, Sunday first, padded with greyed-out days outside the trip.
    var first = ds[0], last = ds[ds.length - 1], todayKey = todaySF();
    var from = new Date(first); from.setDate(from.getDate() - from.getDay());
    var to = new Date(last); to.setDate(to.getDate() + 6 - to.getDay());
    var months = MONTHS[first.getMonth()] + (first.getMonth() !== last.getMonth() ? ' – ' + MONTHS[last.getMonth()] : '') + ' ' + last.getFullYear();
    h.push('<div class="cal-title">' + months + '</div>');
    h.push('<div class="cal-head" aria-hidden="true">' + DOW.map(function(w){ return '<span>' + w + '</span>'; }).join('') + '</div><div class="cal">');
    for (var d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
      var k = iso(d), out = d < first || d > last, showMon = d.getDate() === 1 || +d === +first;
      var dn = '<span class="dn">' + (showMon ? MON[d.getMonth()] + ' ' : '') + d.getDate() + '</span>';
      if (out) { h.push('<div class="cal-day out">' + dn + '</div>'); continue; }
      var rs = resOn(k), picked = !!sel[k];
      h.push('<div class="cal-day' + (k === todayKey ? ' today' : '') + (rs.length ? ' covered' : '') + '">' + dn);
      rs.forEach(function(r){
        h.push('<button class="res" data-id="' + r.id + '" title="Change or remove" aria-label="' + esc(fmtShort(d) + ', ' + timeLabel(r.time) + ': ' + r.name) + '">' +
          '<small><span class="full">' + esc(timeLabel(r.time)) + '</span><span class="short">' + TIME_SHORT[r.time] + '</span></small>' +
          '<span class="nm full">' + esc(r.name) + '</span><span class="nm short">' + esc(r.name.split(/\s+/)[0]) + '</span></button>');
      });
      // Empty days get a big "Open" target; covered days a small "+" to add another sitter.
      h.push('<button class="add' + (picked ? ' sel' : rs.length ? ' more' : ' open') + '" data-date="' + k + '" aria-pressed="' + picked + '" aria-label="' + esc(fmtShort(d) + ': ' + (picked ? 'picked' : rs.length ? 'add another visit' : 'open')) + '">' +
        (picked ? 'Picked' : rs.length ? '+' : 'Open') + '</button>');
      h.push('</div>');
    }
    h.push('</div>');
  }
  h.push('</section>');

  h.push('</div>');

  var n = Object.keys(sel).length;
  if (n) h.push('<div class="bar"><div class="in"><span><b>' + n + '</b> day' + (n > 1 ? 's' : '') + ' picked</span><span class="actions"><button class="btn ghost" id="clearSel">Clear</button><button class="btn" id="reserve">Reserve</button></span></div></div>');
  app.innerHTML = h.join('');
  if (modal) app.appendChild(modal);
}

function openModal(html){ modal = document.createElement('div'); modal.className = 'modal'; modal.innerHTML = '<div class="card" role="dialog" aria-modal="true">' + html + '</div>'; app.appendChild(modal); var f = modal.querySelector('input,textarea'); if (f) f.focus(); }
function closeModal(){ if (modal) modal.remove(); modal = null; editing = null; }
function toast(msg){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200); }

function reserveForm(){
  var list = Object.keys(sel).sort().map(function(k){ return fmtShort(parseDate(k)); });
  openModal('<h3>Reserve ' + list.length + ' day' + (list.length > 1 ? 's' : '') + '</h3><div class="picked">' + list.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' +
    '<div class="row"><div class="field"><label for="w_name">Your name</label><input id="w_name" value="' + esc(visitor.name) + '" autocomplete="name" maxlength="60"></div>' +
    '<div class="field"><label for="w_time">Roughly when</label><select id="w_time">' + timeOptions(visitor.time) + '</select></div></div>' +
    (list.length > 1 ? '<p class="ro">Same time for each day.</p>' : '') +
    '<div class="actions"><button class="btn ghost" id="m_cancel">Cancel</button><button class="btn" id="w_reserve">Reserve</button></div>');
}

function editForm(id){
  var r = RES.filter(function(x){ return x.id === id; })[0]; if (!r) return;
  editing = r;
  openModal('<h3>' + esc(fmtShort(parseDate(r.date))) + '</h3>' +
    '<div class="row"><div class="field"><label for="e_name">Sitter name</label><input id="e_name" value="' + esc(r.name) + '" maxlength="60"></div>' +
    '<div class="field"><label for="e_time">Roughly when</label><select id="e_time">' + timeOptions(r.time) + '</select></div></div>' +
    '<div class="actions"><button class="btn danger" id="e_remove">Remove</button><button class="btn ghost" id="m_cancel">Cancel</button><button class="btn" id="e_save">Save</button></div>');
}

function choreForm(id){
  var t = choreTask(id); if (!t) return;
  editing = t;
  var today = todaySF();
  openModal('<h3>' + esc(t.label) + '</h3>' +
    '<div class="row"><div class="field"><label for="c_name">Your name</label><input id="c_name" value="' + esc(visitor.name) + '" autocomplete="name" maxlength="60"></div>' +
    '<div class="field"><label for="c_date">Done on</label><input id="c_date" type="date" value="' + today + '" max="' + today + '"></div></div>' +
    '<div class="actions"><button class="btn ghost" id="m_cancel">Cancel</button><button class="btn" id="c_save">Sign off</button></div>');
}

// ---- shared reservation list, kept by the server ----
function applyServer(st){ RES = st.reservations || []; TIMES = st.times || TIMES; PHOTOS = st.photos || PHOTOS; UPLOADS = st.uploads || UPLOADS; CHORES = st.chores || CHORES; }
function loadState(){
  return fetch('api/state').then(function(r){ return r.json(); }).then(function(st){ applyServer(st); if (!modal) render(); }).catch(function(){});
}
// Send one change; on success adopt the server's list and close the dialog.
function save(method, url, body, btnId, label, done){
  var btn = document.getElementById(btnId); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  fetch(url, {method: method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined})
    .then(function(r){ return r.json().then(function(j){ return {ok: r.ok, status: r.status, j: j}; }); })
    .then(function(res){
      if (res.j && res.j.reservations) applyServer(res.j);
      if (!res.ok) {
        if (res.status === 404) { closeModal(); render(); toast('Someone else already removed that'); return; }
        throw new Error(res.j && res.j.error);
      }
      if (done) done();
      closeModal(); render(); toast('Saved');
    })
    .catch(function(){ if (btn) { btn.disabled = false; btn.textContent = label; } toast('Could not save. Try again.'); });
}

// ---- events ----
app.addEventListener('click', function(ev){
  var t = ev.target.closest('button, a'); if (!t) return;
  var id = t.id;
  if (t.classList.contains('add')) { var k = t.getAttribute('data-date'); if (sel[k]) delete sel[k]; else sel[k] = true; render(); return; }
  if (t.classList.contains('res')) { editForm(+t.getAttribute('data-id')); return; }
  if (t.hasAttribute('data-chore')) { choreForm(t.getAttribute('data-chore')); return; }
  if (t.classList.contains('unlog')) {
    if (!confirm('Remove this sign-off?')) return;
    fetch('api/chores/' + t.getAttribute('data-log'), {method: 'DELETE'}).then(function(r){ return r.json(); })
      .then(function(st){ applyServer(st); render(); toast('Removed'); }, function(){ toast('Could not remove. Try again.'); });
    return;
  }
  if (id === 'addPhotos') { photoInput.value = ''; photoInput.click(); return; }
  if (t.classList.contains('rm')) {
    if (!confirm('Remove this photo?')) return;
    fetch('api/photos/' + t.getAttribute('data-photo'), {method: 'DELETE'}).then(function(r){ return r.json(); })
      .then(function(st){ applyServer(st); render(); toast('Removed'); }, function(){ toast('Could not remove. Try again.'); });
    return;
  }
  if (id === 'clearSel') { sel = {}; render(); }
  else if (id === 'reserve') reserveForm();
  else if (id === 'm_cancel') closeModal();
  else if (id === 'w_reserve') {
    var nm = document.getElementById('w_name').value.trim(), tm = document.getElementById('w_time').value;
    if (!nm) { document.getElementById('w_name').focus(); toast('Add your name first'); return; }
    visitor = {name: nm, time: tm}; try { localStorage.setItem('kitten-visitor', JSON.stringify(visitor)); } catch(e){}
    save('POST', 'api/reservations', {dates: Object.keys(sel), name: nm, time: tm}, 'w_reserve', 'Reserve', function(){ sel = {}; });
  }
  else if (id === 'e_save') {
    var en = document.getElementById('e_name').value.trim();
    if (!en) { document.getElementById('e_name').focus(); toast('Add a name, or press Remove'); return; }
    save('PUT', 'api/reservations/' + editing.id, {name: en, time: document.getElementById('e_time').value}, 'e_save', 'Save');
  }
  else if (id === 'c_save') {
    var cn = document.getElementById('c_name').value.trim(), cd = document.getElementById('c_date').value;
    if (!cn) { document.getElementById('c_name').focus(); toast('Add your name first'); return; }
    if (!parseDate(cd)) { document.getElementById('c_date').focus(); toast('Pick a date'); return; }
    visitor.name = cn; try { localStorage.setItem('kitten-visitor', JSON.stringify(visitor)); } catch(e){}
    save('POST', 'api/chores', {task: editing.id, date: cd, name: cn}, 'c_save', 'Sign off');
  }
  else if (id === 'e_remove') save('DELETE', 'api/reservations/' + editing.id, null, 'e_remove', 'Remove');
});
// The file picker lives outside #app so re-renders (e.g. the 30s refresh) can't detach it mid-pick.
var photoInput = document.createElement('input');
photoInput.type = 'file'; photoInput.accept = 'image/*'; photoInput.multiple = true; photoInput.hidden = true;
document.body.appendChild(photoInput);
photoInput.addEventListener('change', function(){
  var files = Array.prototype.slice.call(photoInput.files || []);
  if (!files.length) return;
  if (files.length > 10) { toast('Up to 10 at a time'); files = files.slice(0, 10); }
  var big = files.filter(function(f){ return f.size > 25 * 1024 * 1024; }).length;
  files = files.filter(function(f){ return f.size <= 25 * 1024 * 1024; });
  if (!files.length) { toast('Too big (25 MB max)'); return; }
  var fd = new FormData();
  files.forEach(function(f){ fd.append('photos', f); });
  fd.append('name', visitor.name || '');
  uploading = true; render();
  fetch('api/photos', {method: 'POST', body: fd}).then(function(r){ return r.json(); }).then(function(st){
    if (st.uploads) applyServer(st);
    var bad = (st.failed || 0) + big, ok = files.length + big - bad;
    toast(ok ? 'Added ' + ok + ' photo' + (ok > 1 ? 's' : '') + (bad ? '; ' + bad + ' could not be used' : '') : 'Could not use ' + (bad > 1 ? 'those files' : 'that file'));
  }, function(){ toast('Upload failed. Try again.'); }).then(function(){ uploading = false; galleryOpen = true; render(); });
});

// 'toggle' doesn't bubble, so listen in the capture phase.
app.addEventListener('toggle', function(ev){
  if (ev.target.id === 'moreKittens') galleryOpen = ev.target.open;
  var care = ev.target.getAttribute && ev.target.getAttribute('data-care'); if (care) careOpen[care] = ev.target.open;
  var hist = ev.target.getAttribute && ev.target.getAttribute('data-hist'); if (hist) histOpen[hist] = ev.target.open;
}, true);
document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && modal) closeModal(); });

render();
// Anyone with the link can add, change or remove reservations; refresh so others' changes show up.
loadState();
setInterval(function(){ if (!document.hidden && !modal) loadState(); }, 30000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden && !modal) loadState(); });
})();
</script>
